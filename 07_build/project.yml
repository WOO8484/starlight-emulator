# project.yml — XcodeGen 스펙 (Windows 에서 작성, Mac 에서 프로젝트/워크스페이스 생성)
#
# 사용법(Mac):
#   brew install xcodegen
#   cd 07_build && xcodegen generate
#   → StarlightEmulator.xcodeproj 생성 → Xcode 로 열어 빌드/실기기 실행
#
# 엔진 링크 활성화(각 엔진 정적 라이브러리/xcframework 준비 후):
#   1) 아래 SWIFT_ACTIVE_COMPILATION_CONDITIONS 에 PPSSPP_LINKED ARMSX2_LINKED MELONX_LINKED 중 필요한 것 추가
#   2) 아래 GCC_PREPROCESSOR_DEFINITIONS 에 동일 매크로를 =1 로 추가(.mm 가드용)
#   3) dependencies 에 해당 .a / .xcframework 추가, HEADER_SEARCH_PATHS 에 엔진 헤더 경로 추가
#
name: StarlightEmulator

options:
  bundleIdPrefix: com.starlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone 전용 (지시문 16: iPhone 16 Pro Max 고정)
    ONLY_ACTIVE_ARCH: "YES"
    ENABLE_BITCODE: "NO"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"

targets:
  StarlightEmulator:
    type: application
    platform: iOS
    sources:
      - path: ../02_host/StarlightEmulator
      - path: ../03_adapters
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_NAME: StarlightEmulator
        PRODUCT_BUNDLE_IDENTIFIER: com.starlight.emulator
        INFOPLIST_FILE: ../02_host/StarlightEmulator/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../02_host/StarlightEmulator/StarlightEmulator.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ../02_host/StarlightEmulator/StarlightEmulator-Bridging-Header.h
        CLANG_ENABLE_MODULES: "YES"
        # 브리지 .h 는 순수 Obj-C 인터페이스만 노출(구현만 .mm/Obj-C++). Swift/C++ interop 모드 불필요.

        # 엔진 미링크 기본값(스캐폴드 빌드 가능). 링크 시 매크로 추가:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""            # 예: "PPSSPP_LINKED ARMSX2_LINKED MELONX_LINKED"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          # - "PPSSPP_LINKED=1"
          # - "ARMSX2_LINKED=1"
          # - "MELONX_LINKED=1"

        # 엔진 헤더 경로(링크 시 주석 해제/수정):
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          # - "$(SRCROOT)/../01_sources/PPSSPP"
          # - "$(SRCROOT)/../01_sources/ARMSX2"
          # - "$(SRCROOT)/../01_sources/ARMSX2/pcsx2"
          # - "$(SRCROOT)/../01_sources/MeloNX/src/MeloNX/MeloNX/App/Core/Headers"

    # 엔진 정적 라이브러리/프레임워크는 통합 시 여기에 추가:
    dependencies: []
      # - framework: ../01_sources/MeloNX/src/MeloNX/MeloNX/Dependencies/XCFrameworks/SDL2.xcframework
      #   embed: true
      # - framework: <Ryujinx NativeAOT 라이브러리(RyujinxHelper.framework 대체)>
      #   embed: true
      # - target: libPPSSPP           # (별도 정적 라이브러리 타깃으로 추가 가능)
      # - target: libARMSX2

  # 코어 전환 자동화 테스트(지시문 12항)
  StarlightEmulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../06_tests/StarlightEmulatorUITests
    dependencies:
      - target: StarlightEmulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starlight.emulator.uitests
        TEST_TARGET_NAME: StarlightEmulator


schemes:
  StarlightEmulator:
    build:
      targets:
        StarlightEmulator: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StarlightEmulatorUITests
