# project.yml — XcodeGen 스펙 (Windows 작성, Mac/CI 에서 생성)
#
# 엔진 링크 설정(*_LINKED, 헤더/라이브러리/OTHER_LDFLAGS)은 generate_host.sh 가 prebuilt/ 기준으로
# starlight_engines.xcconfig 를 생성해 주입한다(configFiles). 즉 이 파일에는 엔진 링크를 하드코딩하지 않는다.
#
# Mac/CI 흐름:  build_<engine>_ios.sh → generate_host.sh(→xcconfig+xcodegen) → xcodebuild
#
name: StarlightEmulator

options:
  bundleIdPrefix: com.starlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone 전용 (지시문 16: iPhone 16 Pro Max)
    ONLY_ACTIVE_ARCH: "YES"
    ENABLE_BITCODE: "NO"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    CLANG_CXX_LIBRARY: "libc++"

targets:
  StarlightEmulator:
    type: application
    platform: iOS
    sources:
      - path: ../02_host/StarlightEmulator
      - path: ../03_adapters
        excludes:
          - "**/*.md"
    # 엔진 링크는 generate_host.sh 가 만드는 xcconfig 가 담당(수동 편집 금지)
    configFiles:
      Debug: starlight_engines.xcconfig
      Release: starlight_engines.xcconfig
    settings:
      base:
        PRODUCT_NAME: StarlightEmulator
        PRODUCT_BUNDLE_IDENTIFIER: com.starlight.emulator
        INFOPLIST_FILE: ../02_host/StarlightEmulator/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../02_host/StarlightEmulator/StarlightEmulator.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ../02_host/StarlightEmulator/StarlightEmulator-Bridging-Header.h
        CLANG_ENABLE_MODULES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies: []

  # 코어 전환 자동화 테스트(지시문 12항)
  StarlightEmulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../06_tests/StarlightEmulatorUITests
    dependencies:
      - target: StarlightEmulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starlight.emulator.uitests
        TEST_TARGET_NAME: StarlightEmulator

schemes:
  StarlightEmulator:
    build:
      targets:
        StarlightEmulator: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StarlightEmulatorUITests
