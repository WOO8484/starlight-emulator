# project.yml — XcodeGen 스펙 (Windows 에서 작성, Mac 에서 프로젝트/워크스페이스 생성)
#
# 기본 상태: 세 엔진 모두 "미링크" 스캐폴드 → 그대로 xcodegen generate 하면 통합-테스트 UI 만 빌드된다.
# 엔진 링크: 07_build/build_<engine>_ios.sh 로 prebuilt/<engine> 생성 후, 아래 각 엔진 블록의
#            [LINK] 표시 줄 주석을 해제한다. (build_all_ios.sh 가 순서대로 수행)
#
# Mac 최종 흐름:  bash build_all_ios.sh   (PPSSPP→ARMSX2→MeloNX→generate→xcodebuild)
#
name: StarlightEmulator

options:
  bundleIdPrefix: com.starlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone 전용 (지시문 16: iPhone 16 Pro Max)
    ONLY_ACTIVE_ARCH: "YES"
    ENABLE_BITCODE: "NO"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"   # PCSX2 는 C++20
    CLANG_CXX_LIBRARY: "libc++"

targets:
  StarlightEmulator:
    type: application
    platform: iOS
    sources:
      - path: ../02_host/StarlightEmulator
      - path: ../03_adapters
        excludes:
          - "**/*.md"
      # [LINK ARMSX2] Host:: 재사용 위해 pcsx2-sdl/Main.cpp 를 -DARMSX2_EMBED 로 컴파일:
      # - path: ../01_sources/ARMSX2/pcsx2-sdl/Main.cpp
      #   compilerFlags: "-DARMSX2_EMBED=1"

    settings:
      base:
        PRODUCT_NAME: StarlightEmulator
        PRODUCT_BUNDLE_IDENTIFIER: com.starlight.emulator
        INFOPLIST_FILE: ../02_host/StarlightEmulator/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../02_host/StarlightEmulator/StarlightEmulator.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ../02_host/StarlightEmulator/StarlightEmulator-Bridging-Header.h
        CLANG_ENABLE_MODULES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

        # ── 엔진 링크 매크로 (prebuilt 준비 후 해당 항목 추가) ──────────────────
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""   # [LINK] 예: "MELONX_LINKED"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          # - "PPSSPP_LINKED=1"     # [LINK PPSSPP]
          # - "ARMSX2_LINKED=1"     # [LINK ARMSX2]
          # - "MELONX_LINKED=1"     # [LINK MELONX]  (+ 위 SWIFT_ACTIVE_COMPILATION_CONDITIONS 에도 추가)

        # ── 엔진 헤더 경로 ────────────────────────────────────────────────
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          # [LINK PPSSPP]
          # - "$(SRCROOT)/../01_sources/PPSSPP"
          # [LINK ARMSX2]
          # - "$(SRCROOT)/../01_sources/ARMSX2"
          # - "$(SRCROOT)/../01_sources/ARMSX2/pcsx2"
          # - "$(SRCROOT)/../01_sources/ARMSX2/common"
          # - "$(SRCROOT)/../01_sources/ARMSX2/3rdparty/fmt/include"
          # [LINK MELONX]
          # - "$(SRCROOT)/../01_sources/MeloNX/src/MeloNX/MeloNX/App/Core/Headers"

        # ── 정적 라이브러리(.a) 검색 경로 ─────────────────────────────────
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          # - "$(SRCROOT)/prebuilt/ppsspp"   # [LINK PPSSPP]
          # - "$(SRCROOT)/prebuilt/armsx2"   # [LINK ARMSX2]
        # ── 프레임워크/dylib 검색 경로 ────────────────────────────────────
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          # - "$(SRCROOT)/prebuilt/melonx/XCFrameworks"       # [LINK MELONX]
          # - "$(SRCROOT)/prebuilt/melonx/DynamicLibraries"   # [LINK MELONX]

    dependencies: []
      # ── PPSSPP [LINK PPSSPP] ──────────────────────────────────────────
      # - framework: prebuilt/ppsspp/libMoltenVK.dylib
      #   embed: true
      # (libPPSSPPCore.a 및 3rd-party .a 는 LIBRARY_SEARCH_PATHS + OTHER_LDFLAGS 로 링크:
      #  OTHER_LDFLAGS 에 "-lPPSSPPCore" 등 추가. 시스템 프레임워크는 BUILD_NOTES §PPSSPP 참조)
      #
      # ── ARMSX2 [LINK ARMSX2] ─────────────────────────────────────────
      # - framework: prebuilt/armsx2/... (필요 시)
      # (libPCSX2.a, libcommon.a 는 LIBRARY_SEARCH_PATHS + OTHER_LDFLAGS "-lPCSX2 -lcommon")
      #
      # ── MeloNX [LINK MELONX] ─────────────────────────────────────────
      # - framework: prebuilt/melonx/DynamicLibraries/Ryujinx.Headless.SDL2.dylib
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/SDL2.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/libavcodec.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/libavformat.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/libavutil.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/libavfilter.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/libswscale.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/libswresample.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/libSPIRV.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/XCFrameworks/libteakra.xcframework
      #   embed: true
      # - framework: prebuilt/melonx/DynamicLibraries/RyujinxHelper.framework
      #   embed: true
      # - framework: prebuilt/melonx/DynamicLibraries/BreakpointJIT.framework
      #   embed: true
      # - framework: prebuilt/melonx/DynamicLibraries/libMoltenVK.dylib
      #   embed: true

  # 코어 전환 자동화 테스트(지시문 12항)
  StarlightEmulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../06_tests/StarlightEmulatorUITests
    dependencies:
      - target: StarlightEmulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starlight.emulator.uitests
        TEST_TARGET_NAME: StarlightEmulator

schemes:
  StarlightEmulator:
    build:
      targets:
        StarlightEmulator: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StarlightEmulatorUITests
